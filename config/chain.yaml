# Fictional chain. No real retailer, store or person. Towns are used only as locations.
chain:
  name: "Marché du Rhin (fictional)"
  hq: Strasbourg
  distribution_centres: ["DC Nord (Strasbourg)", "DC Sud (Mulhouse)"]

per_store:
  frozen_cabinets: 16        # C01-C16, setpoint -24 C
  chilled_cabinets: 8        # C17-C24, setpoint +2 C
  frozen_setpoint: -24.0
  chilled_setpoint: 2.0
  cabinet_model: "EKC 202C"
  manager_model: "AK-SM 800A"
  patched_firmware: "4.3.1"
  vulnerable_firmware: "4.2"
  signage_players: 2
  tv_boxes: 1
  cameras: 3

