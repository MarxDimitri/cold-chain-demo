# Security advisories as data. The agent and the hunt read them from the knowledge base (`kb-advisories`, loaded by `make lookups`): their
# prompts never name a vulnerability. To add a new one, add an entry here and run `make lookups` (the live query must also collect the
# product: software inventory, CPU flags, process command lines).
#
# Facts are paraphrased; keep the source. Versions are dotted numbers (up to four parts). `branches` give, per release line, the first
# affected version and the first fixed version. `requires_cpu_flag` and `mitigation_args` are optional (up to two arguments).
advisories:
  - id: CVE-2026-114938
    name: Java4Shell
    source: "BSI BITS-H 2026-306673-1032, 18.11.2026 (TLP:CLEAR), paraphrased"
    published: "2026-11-18"
    cvss_v4: 9.2
    cvss_v31: 8.1
    criticality: "2 / yellow"
    product: OpenJDK
    process: java
    flaw: "memory corruption in the optimised Base64 decoder of OpenJDK (negative length on padding)"
    hardware: "only x86-64 with AVX-512 VBMI (Intel Xeon Ice Lake and later, AMD Zen 4 and later); ARM64 is not affected"
    condition: "the application passes attacker-controlled Base64 input to the decoder, for example HTTP Basic or SAML tokens"
    exploitation: "denial of service is easy, remote code execution is hard; no public exploit and no known attack, first attempts seen by Greynoise"
    workaround: "start the JVM with -XX:-UseBASE64Intrinsics or -XX:UseAVX=2, then restart it"
    mitigation: "update to a fixed OpenJDK and restart the Java processes; restrict access to Java applications reachable from the internet"
    requires_cpu_flag: avx512vbmi
    mitigation_args: ["-XX:-UseBASE64Intrinsics", "-XX:UseAVX=2"]
    branches:
      - {branch: "17", affected_from: "17.0.6", fixed_in: "17.0.21.1"}
      - {branch: "21", affected_from: "21.0.0", fixed_in: "21.0.13.1"}
      - {branch: "25", affected_from: "25.0.0", fixed_in: "25.0.5.1"}
      - {branch: "27", affected_from: "27.0.0", fixed_in: "27.0.1.1"}
