# The POS scenario (hypothetical), in the three weeks BEFORE the blip: the back-office POS PC of store S07 is compromised through its
# vendor update channel. It downloads a payload at night, and from 2026-11-09 it reaches the refrigeration system manager, which a
# POS PC never did. It is how the attacker changes S07's setpoints from inside the store at T0 (config/attack.yaml
# setpoint_change.from_inside). The store network is flat (an assumption of the fictional chain): nothing separates the POS
# systems from the refrigeration controller. Fictional: sync.example-cdn.net and 192.0.2.77 are documentation names and addresses.
# The data lives in its own data-stream namespace (`pos`) and in its own dates, so the main demo's streams, baselines and live
# replay are untouched.
window:
  start: "2026-10-22"        # 12 days of normal behaviour first, then the story
  days: 21                   # ends 2026-11-12 00:00 UTC, the morning of the attack (T0 02:52)
namespace: pos
store: S07                   # the back-office POS, its lanes and cameras; the other 19 stores' back-office PCs are the peers

download:
  server_name: sync.example-cdn.net
  server_ip: 192.0.2.77
  first_night: "2026-11-05"
  nights: 7
  night_start_utc: "01:30"   # 02:30 in Colmar, the store is closed
  night_hours: 4
  total_gib: 4.0
  chunk_mb: [20, 60]
  chunks: 96
  ja3: "e7d705a3286e19ea42f587b344ee6865"   # unusual client fingerprint (made up)

# Internal movement, escalating night by night. Never seen before in the store.
internal_flows:
  - {name: pos-to-camera, src: pos-backoffice, dst: camera, port: 554, from: "2026-11-07", every_minutes: 5}
  - {name: pos-to-manager, src: pos-backoffice, dst: system-manager, port: 80, from: "2026-11-09", every_minutes: 30}

pos:
  cpu_busy: 0.88                    # the back-office PC at night, on the download nights
  disk_free_start_pct: 64
  disk_free_end_pct: 22             # the payload and its staging fill the disk

ja3_normal:
  pos-backoffice: "a0e9f5d64349fb13191bc781f81f42e1"
  pos-lane: "b32309a26951912be7dba376398abc3b"
  store-server: "c12f54a3f91dc7bafd92cb59fe858a2c"
server_names:
  "192.0.2.10": telemetry.vendor-cloud.example
  "192.0.2.30": updates.pos-vendor.example
  "192.0.2.40": pay.gateway.example
